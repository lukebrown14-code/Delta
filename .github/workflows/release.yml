# Release packaging via cargo-dist (R4). Homebrew tap: push the generated
# bottle formula to a `homebrew-tap` repo once the tap exists (the dist
# workflow prints the formula under `homebrew_dir` when configured).
name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-14 # arm64
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-dist
        run: curl -LsSf https://get.axo.dev/cargo-dist | sh
      - name: Build archives
        run: cargo dist build --target=${{ matrix.target }} --output-format=json
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: delta-${{ matrix.target }}
          path: target/distrib/*
