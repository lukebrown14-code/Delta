[package]
name = "delta-services"
description = "Pipeline services for Delta: ingest, extract, pulse, costs, config ops."
edition.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
delta-core = { path = "../delta-core" }
delta-llm = { path = "../delta-llm" }
delta-plugins = { path = "../delta-plugins" }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
# Same version/features as delta-core (already in the build graph).
rusqlite = { version = "0.32", features = ["bundled"] }
async-trait = "0.1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "time"] }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
