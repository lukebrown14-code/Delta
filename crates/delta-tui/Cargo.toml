[package]
name = "delta-tui"
description = "Delta TUI: ratatui component-based terminal app."
edition.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
crossterm = "0.28"
delta-core = { path = "../delta-core" }
ratatui = "0.29"

[[bin]]
name = "delta"
path = "src/main.rs"

[dev-dependencies]
serde_json = "1"
