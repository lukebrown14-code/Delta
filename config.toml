base_currency = "AUD"
db_path = "data/rigger.db"
reports_dir = "reports"

[universe]
us = [
    "AAPL",
    "MSFT",
    "NVDA",
    "GOOGL",
    "AMZN",
]
asx = [
    "BHP",
    "CBA",
    "CSL",
    "WES",
    "FMG",
]

[llm]
provider = "openrouter"

[llm.routing]
extract = "google/gemini-2.5-flash"
report = "anthropic/claude-sonnet-4"
chat = "anthropic/claude-sonnet-4"
thesis = "google/gemini-2.5-flash"
thesis_summary = "google/gemini-2.5-flash"

[plugins.yfinance]
enabled = true

[plugins.yfinance.suffixes]
us = ""
asx = ".AX"

[plugins.asx]
enabled = true

[plugins.asx_announcements]
enabled = true
count = 20
timeout = 20
max_retries = 3
backoff_seconds = 1.0

[plugins.sec_edgar]
enabled = true
contact = "luke_brown14@icloud.com"

[plugins.rss]
enabled = true
feeds = [
    "https://feeds.a.dj.com/rss/RSSMarketsMain.xml",
    "https://www.cnbc.com/id/10001147/device/rss/rss.html",
    "https://feeds.bbci.co.uk/news/business/rss.xml",
]

[plugins.yfinance_calendar]
enabled = true

[targets.BHP]
kind = "company"
market = "asx"
tickers = [
    "BHP",
]
tags = [
    "Mining",
]

[targets.apple]
kind = "company"
market = "us"
tickers = [
    "APPL",
]

[targets."Rio Tinto Group"]
kind = "company"
market = "us"
tickers = [
    "RIO",
]
tags = [
    "mining",
]
