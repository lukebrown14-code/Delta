base_currency = "AUD"
db_path = "data/rigger.db"
reports_dir = "reports"

[universe]
us = ["AAPL", "MSFT", "NVDA", "GOOGL", "AMZN"]
asx = ["BHP", "CBA", "CSL", "WES", "FMG"]

[llm]
provider = "openrouter"                # litellm | openrouter | litellm-proxy
proxy_base_url = "http://localhost:4000"

[llm.routing]
extract = "google/gemini-flash-1.5"
analyse = "anthropic/claude-sonnet-4"
critique = "openai/gpt-4o"
pm = "anthropic/claude-opus-4"

[llm.ensemble]
models = ["anthropic/claude-sonnet-4", "openai/gpt-4o", "gemini/gemini-pro-1.5"]

[paper]
starting_cash = 100000
slippage_bps = 5

[risk]
max_position_pct = 5
max_sector_pct = 25
max_gross_exposure_pct = 100
min_conviction = 0.6
daily_loss_halt_pct = 3

[schedule]
ingest = "0 6 * * 1-5"
analyse = "30 6 * * 1-5"
execute = "0 10 * * 1-5"
report = "15 10 * * 1-5"
evaluate = "0 18 * * 5"

[plugins.yfinance]
enabled = true
# yfinance ticker suffix per market; add a market here, not in code
suffixes = { us = "", asx = ".AX" }

[plugins.ensemble]
enabled = true

[plugins.critic]
enabled = true
wraps = "llm_analyst"

[plugins.asx]
enabled = true

[plugins.asx_announcements]
enabled = true
count = 20            # announcements per company per fetch
timeout = 20          # seconds
max_retries = 3       # on 429/5xx, exponential backoff from backoff_seconds
backoff_seconds = 1.0

[plugins.sec_edgar]
enabled = true
contact = "you@example.com"  # SEC requires a contact address in the User-Agent


[plugins.rss]
enabled = true
# Business news feeds. Items are matched to universe instruments by ticker or
# company name; unmatched (macro) items are still stored with no instrument.
feeds = [
    "https://feeds.a.dj.com/rss/RSSMarketsMain.xml",
    "https://www.cnbc.com/id/10001147/device/rss/rss.html",
    "https://feeds.bbci.co.uk/news/business/rss.xml",
]

[plugins.momentum]


[plugins.yfinance_calendar]
enabled = true
