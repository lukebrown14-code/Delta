[project]
name = "rigger"
version = "0.1.0"
description = "AI-driven investment research and paper-trading harness"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlmodel>=0.0.21",
    "openai>=1.35",
    "httpx>=0.27",
    "apscheduler>=3.10",
    "jinja2>=3.1",
    "yfinance>=0.2.40",
    "pandas>=2.2",
    "numpy>=1.26",
    "tomli-w>=1.0",
    "litellm>=1.100.1",
]

[project.scripts]
rig = "rigger.cli:app"

[project.entry-points."rigger.plugins"]
us_market = "rigger.plugins.markets.us:USMarket"
yfinance_data = "rigger.plugins.data.yfinance:YFinanceData"
sec_edgar = "rigger.plugins.data.sec_edgar:SECEdgar"
llm_analyst = "rigger.plugins.strategies.llm_analyst:LLMAnalyst"
paper_broker = "rigger.plugins.brokers.paper:PaperBroker"
markdown_report = "rigger.plugins.reports.markdown:MarkdownReport"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "respx>=0.23.1",
]
