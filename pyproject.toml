[project]
name = "delta"
version = "0.1.0"
description = "AI-driven investment research assistant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "rich>=13.7",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlmodel>=0.0.21",
    "openai>=1.35",
    "httpx>=0.27",
    "apscheduler>=3.10",
    "jinja2>=3.1",
    "yfinance>=1.7.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "tomli-w>=1.0",
    "feedparser>=6.0",
    "textual>=8.2.8",
]

[project.scripts]
delta = "delta.tui.app:run_tui"

[project.entry-points."delta.plugins"]
us_market = "delta.plugins.markets.us:USMarket"
asx_market = "delta.plugins.markets.asx:ASXMarket"
yfinance_data = "delta.plugins.data.yfinance:YFinanceData"
asx_announcements = "delta.plugins.data.asx_announcements:ASXAnnouncements"
sec_edgar = "delta.plugins.data.sec_edgar:SECEdgar"
yfinance_calendar = "delta.plugins.data.yfinance_calendar:YFinanceCalendar"
rss = "delta.plugins.data.rss:RSSData"

[project.entry-points."delta.targets"]
company = "delta.plugins.targets.tickers:CompanyTarget"
sector = "delta.plugins.targets.tickers:SectorTarget"
industry = "delta.plugins.targets.tickers:IndustryTarget"
theme = "delta.plugins.targets.tickers:ThemeTarget"
market = "delta.plugins.targets.tickers:MarketTarget"
tickers = "delta.plugins.targets.tickers:LegacyTickersTarget"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "respx>=0.23.1",
    "ruff>=0.16.7",
]
